# Standalone deployment of the unified image; no source checkout or build required.
name: mcp-platform
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: platform
      POSTGRES_DB: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U platform -d platform]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  server:
    image: ${PLATFORM_IMAGE_PREFIX:-ghcr.io/yibaiba/mcp-platform}:${PLATFORM_VERSION:?Set PLATFORM_VERSION to a published image version}
    environment:
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/platform
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      DEVICE_AUTH_ENCRYPTION_KEY: ${DEVICE_AUTH_ENCRYPTION_KEY:?set DEVICE_AUTH_ENCRYPTION_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      CONFIG_MANIFEST_FILE: ${CONFIG_MANIFEST_FILE:-}
      CONFIG_MANIFEST_OWNER: ${CONFIG_MANIFEST_OWNER:-}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CALL_RETENTION_DAYS: ${CALL_RETENTION_DAYS:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      PORT: 4300
      DATA_DIR: /app/.data
      PLATFORM_STDIO_ENABLED: ${PLATFORM_STDIO_ENABLED:-false}
      PI_ENABLED: ${PI_ENABLED:-false}
      PI_MODEL_PROVIDER: ${PI_MODEL_PROVIDER:-}
      PI_MODEL_ID: ${PI_MODEL_ID:-}
      PI_MCP_ADAPTER_OAUTH_FILE_KEY: ${PI_MCP_ADAPTER_OAUTH_FILE_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_MCP_PER_CREDENTIAL: ${RATE_LIMIT_MCP_PER_CREDENTIAL:-}
      RATE_LIMIT_MCP_PER_USER: ${RATE_LIMIT_MCP_PER_USER:-}
      RATE_LIMIT_MCP_PER_IP: ${RATE_LIMIT_MCP_PER_IP:-}
      RATE_LIMIT_AUTH_PER_IP: ${RATE_LIMIT_AUTH_PER_IP:-}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - '4300:4300'
    volumes:
      - files:/app/.data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  postgres:
  files:
