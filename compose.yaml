# Source build against an external PostgreSQL: only DATABASE_URL is required.
# `docker compose up -d --build` builds, migrates (one-shot `migrate`) and starts the server;
# unset keys are generated into the `files` volume on first start. See docs/deployment.md.
name: mcp-platform
services:
  migrate:
    build:
      context: .
      target: app
    command: [pnpm, db:migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an external PostgreSQL database}
    restart: 'no'
  server:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an external PostgreSQL database}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4300}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      # Empty: generated on first start into /app/.data/secrets (mode 0600) and reused.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DEVICE_AUTH_ENCRYPTION_KEY: ${DEVICE_AUTH_ENCRYPTION_KEY:-}
      AUTO_GENERATE_SECRETS: ${AUTO_GENERATE_SECRETS:-}
      CONFIG_MANIFEST_FILE: ${CONFIG_MANIFEST_FILE:-}
      CONFIG_MANIFEST_OWNER: ${CONFIG_MANIFEST_OWNER:-}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CALL_RETENTION_DAYS: ${CALL_RETENTION_DAYS:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      PORT: 4300
      DATA_DIR: /app/.data
      PLATFORM_STDIO_ENABLED: ${PLATFORM_STDIO_ENABLED:-false}
      PI_ENABLED: ${PI_ENABLED:-false}
      PI_MODEL_PROVIDER: ${PI_MODEL_PROVIDER:-}
      PI_MODEL_ID: ${PI_MODEL_ID:-}
      PI_MCP_ADAPTER_OAUTH_FILE_KEY: ${PI_MCP_ADAPTER_OAUTH_FILE_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_MCP_PER_CREDENTIAL: ${RATE_LIMIT_MCP_PER_CREDENTIAL:-}
      RATE_LIMIT_MCP_PER_USER: ${RATE_LIMIT_MCP_PER_USER:-}
      RATE_LIMIT_MCP_PER_IP: ${RATE_LIMIT_MCP_PER_IP:-}
      RATE_LIMIT_AUTH_PER_IP: ${RATE_LIMIT_AUTH_PER_IP:-}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - '4300:4300'
    volumes:
      - files:/app/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
volumes:
  files:
