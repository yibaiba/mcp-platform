name: Verify platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Enable project package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: Frozen install
        run: node scripts/check.mjs 300 pnpm install --frozen-lockfile
      - name: Start isolated test database
        run: |
          test_db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$test_db_password"
          printf 'DATABASE_URL=postgresql://platform:%s@127.0.0.1:5432/platform\n' "$test_db_password" >> "$GITHUB_ENV"
          docker run --detach --name platform-ci-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=platform --env POSTGRES_DB=platform \
            --env POSTGRES_PASSWORD="$test_db_password" \
            --health-cmd 'pg_isready -U platform -d platform' \
            --health-interval 1s --health-timeout 5s --health-retries 60 pgvector/pgvector:0.8.1-pg17
          timeout 60 bash -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" platform-ci-db)" = healthy ]; do sleep 1; done'
      - name: Migrate and verify repeat migration
        run: |
          node scripts/check.mjs 60 pnpm db:migrate
          node scripts/check.mjs 60 pnpm db:migrate
      - name: Type checking
        run: node scripts/check.mjs 120 pnpm check-types
      - name: Lint
        run: node scripts/check.mjs 120 pnpm lint
      - name: Production build
        env:
          PLATFORM_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: node scripts/check.mjs 180 pnpm build
      - name: Backend integration tests (60 seconds per process)
        run: node scripts/check.mjs 1200 pnpm test
      - name: Real OpenSSH reverse forwarding
        if: matrix.node == '24'
        run: |
          sudo mkdir -p /run/sshd
          node scripts/check.mjs 60 pnpm exec tsx scripts/verify-ssh-forward.mts
      - name: Pi bridge without inference
        run: pnpm test:pi
      - name: Go tests and vet
        working-directory: connector
        run: |
          node ../scripts/check.mjs 60 go test -timeout 60s ./...
          node ../scripts/check.mjs 60 go vet ./...
      - name: Six architecture connector builds
        if: matrix.node == '24'
        run: node scripts/check.mjs 600 pnpm connector:build
      - name: Database logs on failure
        if: failure()
        run: docker logs platform-ci-db
      - name: Remove test database
        if: always()
        run: docker rm --force platform-ci-db

  ssh-windows:
    name: Windows SSH bundle validation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell syntax and native argument handling
        shell: powershell
        run: ./scripts/verify-ssh-windows.ps1

  installers:
    name: Publish connector release files
    needs: [verify, ssh-windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Install build dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          node scripts/check.mjs 300 pnpm install --frozen-lockfile
      - name: Build the six supported connector targets
        run: node scripts/check.mjs 600 node scripts/build-connector.mjs
      - name: Upload binaries, checksums and installers to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" connector/bin/connector-* \
            connector/bin/SHA256SUMS connector/install/install.sh connector/install/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --clobber

  image:
    name: Verify platform image (${{ matrix.arch }})
    needs: [verify, ssh-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache: platform-image
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: platform-image-arm64
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image for acceptance
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          build-args: |
            PLATFORM_COMMIT=${{ github.sha }}
            PLATFORM_RELEASE_TAG=${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: mcp-platform:local
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Verify this repository's packaged application
        run: node scripts/check.mjs 600 node scripts/verify-compose.mjs
      - name: Verify Python MCP with cold and offline warm caches
        run: node scripts/check.mjs 150 node scripts/verify-python-runtime.mjs mcp-platform:local
      - name: Verify stdio sandbox under default container options (explicit refusal or ready)
        run: node scripts/check.mjs 150 node scripts/verify-stdio-sandbox-image.mjs mcp-platform:local default
      - name: Verify stdio sandbox with the documented container options
        # Ubuntu 23.10+ hosts restrict unprivileged user namespaces through AppArmor; the
        # deployment docs list this host setting for STDIO_SANDBOX=bwrap.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          node scripts/check.mjs 150 node scripts/verify-stdio-sandbox-image.mjs mcp-platform:local unconfined
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: github.event_name == 'release'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}-${{ matrix.arch }}
      - name: Publish verified architecture image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          build-args: |
            PLATFORM_COMMIT=${{ github.sha }}
            PLATFORM_RELEASE_TAG=${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  publish:
    name: Publish multi-platform image
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tags after both native architectures pass acceptance
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: sha-${{ github.sha }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:$VERSION" --tag "$IMAGE:$RELEASE_VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
